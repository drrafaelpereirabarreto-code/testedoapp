# Capturas de tela do site no ar, com dados reais (Actions → "Capturas do site" → Run workflow).
#
# Tira fotos das telas novas no celular e no computador (scripts/capturas.mjs), com a localização simulada na
# Av. Paulista. Só navega e digita: não envia pedido, não conta visita e barra qualquer escrita no banco.
# O resultado vai para um ramo próprio, "capturas/execucao-<número>" (o site publicado, que sai da main, não muda).
name: Capturas do site

on:
  workflow_dispatch:
    inputs:
      url:
        description: Endereço do site (troque quando tiver o domínio próprio)
        default: https://drrafaelpereirabarreto-code.github.io/testedoapp/

# Escrita só para criar o ramo das capturas.
permissions:
  contents: write

concurrency:
  group: capturas
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: '1.63.0'

jobs:
  capturar:
    name: Tirar as capturas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar o Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Instalar o Playwright
        run: npm install --prefix . --no-save --no-package-lock --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"

      - name: Recuperar o navegador do cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Instalar o Chromium e as fontes
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-inter fonts-noto-color-emoji \
            || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-inter fonts-noto-color-emoji; }

      - name: Capturar
        env:
          URL_SITE: ${{ inputs.url }}
        run: |
          mkdir -p "$RUNNER_TEMP/capturas"
          node scripts/capturas.mjs --url="$URL_SITE" --saida="$RUNNER_TEMP/capturas" 2>&1 | tee "$RUNNER_TEMP/capturas/registro.txt"
          # Cada erro vira aviso na página da execução (os registros completos ficam no ramo).
          grep '^ERRO ' "$RUNNER_TEMP/capturas/registro.txt" | while IFS= read -r l; do echo "::warning title=Captura que falhou::$l"; done || true
          echo "::notice title=Capturas::$(tail -1 "$RUNNER_TEMP/capturas/registro.txt")"

      - name: Publicar as capturas num ramo próprio
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/capturas"
          ramo="capturas/execucao-${GITHUB_RUN_NUMBER}"
          git init -q -b "$ramo"
          git add -A .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Capturas do site (execução ${GITHUB_RUN_NUMBER})"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$ramo"
          echo "### Capturas prontas no ramo \`$ramo\`" >> "$GITHUB_STEP_SUMMARY"
